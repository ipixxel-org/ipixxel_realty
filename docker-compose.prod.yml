services:
  postgres:
    image: postgres:16
    container_name: realestate-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: realestate
    volumes:
      - realestate-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      target: prod
      network: host
    container_name: realestate-api
    restart: unless-stopped
    # App secrets come from ./backend/.env on the server only (Razorpay keys
    # are normally set in Super Admin > Integrations; RAZORPAY_* here is an
    # optional fallback).
    # Do not add them under `environment:` — an entry there overrides
    # env_file, and `${VAR}` would resolve to "" in the deploy shell.
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/realestate?schema=public"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  realestate-pg-data: